name = "portaledelleutilityitaliano"
compatibility_date = "2024-09-23"

# La directory "./public" DEVE esistere nel repo committato su Git ed è
# generata da `npm run build`. Se compare l'errore "does not exist", i comandi
# sono stati lanciati da una cartella diversa da quella che contiene questo file.
[assets]
directory = "./public"
# Ogni URL inesistente riceve public/404.html con stato 404 (niente SPA fallback:
# ogni tool è una URL indicizzabile a sé).
not_found_handling = "404-page"

# Dominio di produzione — DA ATTIVARE quando utilityitalia.it è registrato e
# risulta "Attivo" su Cloudflare (nameserver cambiati su Aruba). Finché il
# dominio non esiste, questo blocco farebbe fallire ogni deploy: per questo è
# commentato. Per attivarlo togli il "#" dalle tre righe sotto e fai push su
# main (o npm run deploy): Cloudflare crea dominio e certificato HTTPS.
# Il www si reindirizza all'apex con una Redirect Rule: docs/guida-pubblicazione.md.
# [[routes]]
# pattern = "utilityitalia.it"
# custom_domain = true
